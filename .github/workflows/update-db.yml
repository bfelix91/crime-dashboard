name: Update Crime Database

on:
  schedule:
    - cron: "0 6 * * *"  # täglich 06:00 UTC
  workflow_dispatch: {}

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install duckdb pandas requests pyarrow

      - name: Build database
        run: python crime_db.py

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload db-v1 seattle_crime.db --clobber
